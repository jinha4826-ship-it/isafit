<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f7f6f2"><meta name="description" content="내 가구가 새집에 들어갈지 이사 전에 확인하는 이사핏"><title>이사핏 | 내 생활에 맞는 집 찾기</title><style>
:root{--ink:#282b28;--muted:#858981;--paper:#f7f6f2;--line:#e9e8e1;--green:#536c58;--sage:#e8eee6}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.55 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif}.top{position:sticky;top:0;background:#ffffffed;border-bottom:1px solid var(--line);padding:15px 5vw;display:flex;justify-content:space-between;align-items:center;z-index:2}.brand{font-weight:850;font-size:20px}.mark{display:inline-grid;place-items:center;background:var(--green);color:white;border-radius:9px;width:29px;height:29px;margin-right:8px}.wrap{max-width:1100px;margin:auto;padding:24px}.hero{background:#eaece4;border-radius:24px;padding:38px;margin:12px 0 42px;display:flex;justify-content:space-between;gap:20px;align-items:center}.hero h1{font-size:clamp(28px,4vw,43px);line-height:1.2;margin:10px 0}.hero em{color:var(--green);font-style:normal}.hero p,.muted{color:var(--muted)}.eyebrow{font-size:10px;letter-spacing:2px;color:#87917f;font-weight:800}.btn{border:0;border-radius:10px;padding:11px 15px;background:var(--green);color:white;font-weight:700;cursor:pointer;font-size:13px;display:inline-block;text-align:center;text-decoration:none}.btn.alt{background:white;color:var(--green);border:1px solid #dfe3da}.btn:disabled{opacity:.4;cursor:not-allowed}.head{display:flex;justify-content:space-between;align-items:end;margin:30px 0 15px}.head h2{margin:4px 0;font-size:23px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:13px}.card{background:white;border:1px solid var(--line);border-radius:16px;padding:17px}.project{cursor:pointer;text-align:left;color:inherit;width:100%}.project h3{margin:10px 0 3px}.empty{padding:25px;text-align:center;color:var(--muted);border:1px dashed #cfd7ca;border-radius:14px}.furniture{font-size:13px}.actions{display:flex;gap:8px;flex-wrap:wrap}.dialog{border:0;border-radius:18px;width:min(680px,calc(100% - 24px));padding:22px;box-shadow:0 20px 70px #0003}.dialog::backdrop{background:#18201888}.dialog{max-height:90dvh;overflow:auto}.dialog h2{margin:4px 0 18px}.fields{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.fields label{display:block;font-size:12px;color:#596357;font-weight:700}.fields input,.fields select,.fields textarea{display:block;width:100%;padding:10px;border:1px solid var(--line);border-radius:9px;margin-top:5px;background:#fff}.wide{grid-column:1/-1}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.room-layout{display:grid;grid-template-columns:280px 1fr;gap:16px}.panel{background:#fbfaf7;border:1px solid var(--line);border-radius:13px;padding:13px;margin-bottom:10px}.panel h3{font-size:14px;margin:0 0 10px}.panel input,.panel select{width:100%;padding:9px;border:1px solid var(--line);border-radius:8px;margin:4px 0 8px}.canvasbox{background:#efeee8;border-radius:13px;padding:12px;overflow:auto;display:grid;place-items:center;min-height:300px}canvas{background:white;touch-action:none;max-width:100%}.small{font-size:11px;color:var(--muted)}.roomlist button{width:100%;text-align:left;margin:3px 0;background:white;color:var(--ink);border:1px solid var(--line);padding:8px 10px;border-radius:8px;font-size:12px;cursor:pointer}.roomlist button.active{background:var(--sage);border-color:#8ca18a}.status{padding:10px;background:white;border-radius:9px;margin-top:10px;font-size:12px}.status.err{background:#fbf0ec;color:#8d4b3c}.danger{background:transparent;color:#a15f50;border:0;cursor:pointer;font-size:13px}.footer{border-top:1px solid var(--line);padding:22px;text-align:center;color:var(--muted);font-size:11px}
.tag{display:inline-block;font-size:10px;font-weight:800;padding:3px 7px;border-radius:6px;background:#eef1e8;color:#4c6250}.tag.warn{background:#fdf1e3;color:#96632c}
.fpgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;margin-top:9px}
.fpcard{padding:0;border:1px solid var(--line);border-radius:10px;background:white;overflow:hidden;cursor:pointer;text-align:left;font:inherit}
.fpcard img{width:100%;height:80px;object-fit:cover;display:block;background:#eee}
.fpcard span{display:block;font-size:10px;line-height:1.3;padding:5px 6px;color:#5a6258;height:34px;overflow:hidden}
.fpcard:active{border-color:var(--green)}
.planpreview{display:flex;gap:11px;align-items:flex-start;background:#fff;border:1px solid var(--line);border-radius:12px;padding:9px;margin-bottom:9px}
.planpreview img{width:110px;border-radius:8px;display:block;flex:0 0 auto}
.planpreview .pp-body{min-width:0;font-size:12px}
.planpreview .pp-body p{margin:6px 0 0;color:var(--muted);font-size:11px;line-height:1.45}
.spin{display:inline-block;width:11px;height:11px;border:2px solid #cbd3c4;border-top-color:var(--green);border-radius:50%;animation:sp .8s linear infinite;vertical-align:-1px;margin-right:6px}
@media(min-width:701px){.room-layout>section{position:sticky;top:6px;align-self:start}}
@keyframes sp{to{transform:rotate(360deg)}}
@media(max-width:700px){.wrap{padding:15px}.hero{padding:25px}.room-layout{grid-template-columns:1fr}.fields{grid-template-columns:1fr}.wide{grid-column:auto}.head h2{font-size:20px}.top{padding:12px 16px}.fpgrid{grid-template-columns:repeat(2,1fr)}}</style></head><body>
<header class="top"><div class="brand"><span class="mark">이</span>이사핏</div><div class="actions"><button class="btn alt" id="export">백업</button><label class="btn alt">불러오기<input id="import" type="file" accept="application/json" hidden></label></div></header>
<main class="wrap"><section class="hero"><div><span class="eyebrow">MOVE WITH A PLAN</span><h1>집을 고르기 전에,<br><em>내 생활을 먼저 배치해요.</em></h1><p>아파트 단지를 고르면 평면도를 찾아<br>방과 치수를 AI가 자동으로 채워 드려요.</p><button class="btn" id="newProject">＋ 새 이사 프로젝트</button></div><div style="font-size:100px;color:#81927e">⌂</div></section>
<section><div class="head"><div><span class="eyebrow">MY MOVE</span><h2>나의 이사 프로젝트</h2></div><span class="muted" id="count">0개</span></div><div id="projects" class="grid"></div><div id="emptyP" class="empty">아직 등록한 프로젝트가 없어요. 첫 이사 프로젝트를 만들어 보세요.</div></section>
<section><div class="head"><div><span class="eyebrow">MY FURNITURE</span><h2>내 가구 보관함</h2></div><button class="btn alt" id="newFurniture">＋ 가구 등록</button></div><div id="furniture" class="grid"></div><div id="emptyF" class="empty">침대, 소파, 책상 등 가구를 등록해 보세요.</div></section></main>
<dialog class="dialog" id="projectDialog"><form id="projectForm"><h2>새 이사 프로젝트</h2><div class="fields"><label>프로젝트 이름<input name="name" required placeholder="예: 새집 후보 A"></label><label>지역<input name="area" placeholder="예: 경남 김해시"></label><label class="wide">아파트·단지명<input name="aptName" placeholder="예: 부원역푸르지오"></label><label>평형<input name="aptSize" placeholder="예: 84㎡ / 34평"></label><label>희망 이사일<input name="date" type="date"></label><label class="wide">메모<input name="memo" placeholder="원하는 조건"></label></div><div class="modal-actions"><button type="button" class="btn alt" data-close="projectDialog">취소</button><button class="btn">만들기</button></div></form></dialog>
<dialog class="dialog" id="furnitureDialog"><form id="furnitureForm"><h2>내 가구 등록</h2><div class="fields"><label>종류<select name="type"><option>침대</option><option>소파</option><option>냉장고</option><option>책상</option><option>식탁</option><option>옷장</option><option>기타</option></select></label><label>가구 이름<input name="name" required placeholder="예: 퀸 침대"></label><label>가로(mm)<input name="w" type="number" min="500" required></label><label>세로(mm)<input name="d" type="number" min="500" required></label><label>높이(mm)<input name="h" type="number" min="0"></label><label>메모<input name="memo"></label></div><div class="modal-actions"><button type="button" class="btn alt" data-close="furnitureDialog">취소</button><button class="btn">저장</button></div></form></dialog>
<dialog class="dialog" id="detail" style="width:min(1000px,calc(100% - 20px))"><div id="detailContent"></div></dialog>
<footer class="footer">이사핏 초기 체험 버전 · 데이터는 현재 브라우저에 저장됩니다. 실제 치수와 현장 조건은 별도로 확인해 주세요.</footer>
<script>
(()=>{
const $=s=>document.querySelector(s);
const KEY='isafit-v1';
/* 자동 검색·평면도 AI 서버 (고정) */
const API_BASE='https://isafit-apartment-api.cba4826.workers.dev';

let data=load(),pid=null,rid=null,selected=null,drag=null,scale=.15;
let fpItems=[],aiBusy=false,aptItems=[],detailFlash='';
const planCache=new Map();

function load(){try{return JSON.parse(localStorage.getItem(KEY))||{projects:[],furniture:[]}}catch{return{projects:[],furniture:[]}}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(data));return true}catch(e){alert('브라우저 저장 공간이 부족해 저장하지 못했어요. 백업을 내려받고 도면 이미지를 줄여 주세요.');return false}}
function uid(){return Math.random().toString(36).slice(2,10)}
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function project(){return data.projects.find(x=>x.id===pid)}
function room(){return project()?.rooms.find(x=>x.id===rid)}
function dim(v){return Number.isFinite(v)&&v>=500&&v<=30000}

/* ---------------- 목록 ---------------- */
function render(){
  $('#count').textContent=data.projects.length+'개';
  $('#emptyP').hidden=!!data.projects.length;
  $('#projects').innerHTML=data.projects.map(p=>'<button class="card project" data-project="'+p.id+'"><span class="eyebrow">MOVE PROJECT</span><h3>'+esc(p.name)+'</h3><span class="muted">'+esc(p.aptName||p.area||'지역 미입력')+' · '+p.rooms.length+'개 공간</span></button>').join('');
  $('#emptyF').hidden=!!data.furniture.length;
  $('#furniture').innerHTML=data.furniture.map(f=>'<div class="card furniture"><b>'+esc(f.name)+'</b><p>'+esc(f.type)+' · '+f.w+' × '+f.d+'mm</p><button class="danger" data-del="'+f.id+'">삭제</button></div>').join('');
}

function openProject(id0){pid=id0;const p=project();if(!p)return;if(!p.rooms.length)p.rooms.push({id:uid(),name:'거실',w:4000,d:3500,items:[]});rid=p.rooms[0].id;selected=null;aptItems=[];fpItems=[];detailFlash='';$('#detail').showModal();renderDetail();$('#detail').scrollTop=0}

/* ---------------- 상세 ---------------- */
function renderDetail(){
  const p=project();if(!p)return;
  const r=room()||p.rooms[0];rid=r.id;
  const meta=p.planMeta||null;
  const badge=meta?(meta.hasExplicitDimensions?'<span class="tag">도면 치수 직접 인식</span>':'<span class="tag warn">비율 추정치 · 직접 수정 가능</span>'):'';
  const naverHref='https://search.naver.com/search.naver?where=image&query='+encodeURIComponent([p.aptName||'',p.aptSize||'','평면도'].filter(Boolean).join(' '));
  $('#detailContent').innerHTML=`
  <div class="head"><div><span class="eyebrow">YOUR SPACE</span><h2>${esc(p.name)}</h2><span class="muted">${esc(p.area||'지역 미입력')}${p.aptName?' · '+esc(p.aptName):''}${p.aptSize?' · '+esc(p.aptSize):''}</span></div><button class="btn alt" id="closeDetail">닫기</button></div>
  <div class="room-layout"><aside>
    <div class="panel"><h3>공간 목록</h3><div class="roomlist">${p.rooms.map(x=>'<button class="'+(x.id===rid?'active':'')+'" data-room="'+x.id+'">'+esc(x.name)+' · '+x.w+'×'+x.d+(x.estimated?' <span class="small">(추정)</span>':'')+'</button>').join('')}</div><button class="btn alt" id="addRoom" style="width:100%">＋ 공간 추가</button></div>

    <div class="panel"><h3>아파트 평면도 찾기</h3>
      <label class="small">아파트·단지명</label><input id="aptName" value="${esc(p.aptName||'')}" placeholder="예: 부원역푸르지오">
      <label class="small">지역</label><input id="aptArea" value="${esc(p.area||'')}" placeholder="예: 경남 김해시">
      <label class="small">평형 (선택)</label><input id="aptSize" value="${esc(p.aptSize||'')}" placeholder="예: 84㎡ / 34평">
      <button class="btn alt" id="searchPlan" style="width:100%">아파트 단지 검색</button>
      <div id="aptResults" class="status" aria-live="polite">${aptItems.length?'검색 결과 '+aptItems.length+'개가 있어요.':'단지명과 지역을 입력하고 검색해 보세요.'}</div>
      <div class="actions" style="margin-top:9px">
        <button class="btn" id="loadFloorplan" style="flex:1">🔍 도면 자동 불러오기</button>
      </div>
      <a class="btn alt" id="naverPlan" href="${naverHref}" target="_blank" rel="noopener" style="width:100%;margin-top:6px">네이버에서 평면도 찾기</a>
      <div id="fpGrid" class="fpgrid"></div>
      <div id="aiStatus" class="status" hidden></div>
      <p class="small">단지를 고르고 평형을 넣으면 평면도 후보를 찾아 보여 줘요. 후보를 누르면 AI가 방과 치수를 읽어 공간을 채웁니다.</p>
    </div>

    <div class="panel"><h3>평면도 직접 올리기</h3>
      <label class="btn alt" style="display:block">이미지 선택<input id="planUpload" type="file" accept="image/png,image/jpeg,image/webp" hidden></label>
      <button class="btn" id="aiFromUpload" style="width:100%;margin-top:6px" ${r.planImage?'':'disabled'}>✨ AI로 방·치수 자동 인식</button>
      <p class="small" id="planStatus">${r.planImage?'도면이 등록되어 있어요.':'JPG·PNG·WebP 이미지 가능 · PDF 미지원'}</p>
      <button class="btn alt" id="removePlan" style="width:100%" ${r.planImage?'':'disabled'}>도면 제거</button>
    </div>

    <div class="panel"><h3>공간 정보(mm)</h3>
      <label class="small">이름</label><input id="rname" value="${esc(r.name)}" placeholder="예: 거실">
      <label class="small">가로</label><input id="rw" type="number" value="${r.w}">
      <label class="small">세로</label><input id="rd" type="number" value="${r.d}">
      <button class="btn alt" id="applySize" style="width:100%">이 공간에 적용</button>
    </div>

    <div class="panel"><h3>가구 배치</h3>
      <select id="fselect"><option value="">가구 선택</option>${data.furniture.map(f=>'<option value="'+f.id+'">'+esc(f.name)+' · '+f.w+'×'+f.d+'</option>').join('')}</select>
      <button class="btn" id="place" style="width:100%" ${data.furniture.length?'':'disabled'}>선택한 가구 배치</button>
      <p class="small">가구를 클릭한 뒤 드래그해 이동하고 회전할 수 있어요.</p>
      <button class="btn alt" id="rotate" ${selected?'':'disabled'}>↻ 90° 회전</button>
      <button class="btn alt" id="remove" ${selected?'':'disabled'}>선택 삭제</button>
    </div>
  </aside>
  <section>
    ${meta&&p.planImage?'<div class="planpreview"><img src="'+p.planImage+'" alt="인식한 평면도"><div class="pp-body"><b>'+esc(p.aptName||'평면도')+'</b> '+badge+'<p>'+esc(meta.summary||'')+'</p></div></div>':''}
    <div class="canvasbox"><canvas id="floor"></canvas></div>
    <div id="report" class="status"></div>
    <div class="actions" style="margin-top:10px"><button class="btn alt" id="check">공간 검사</button><button class="btn alt" id="print">리포트 인쇄</button></div>
    <p class="small">검사는 가구 외곽 사각형의 겹침과 방 경계만 확인합니다. 문·창문·벽 두께·운반 경로는 판정하지 않아요.</p>
  </section></div>
  <div style="display:flex;justify-content:space-between;margin-top:15px"><button class="danger" id="deleteProject">프로젝트 삭제</button><button class="btn" id="saveProject">저장</button></div>`;
  bind();draw();report(false);
  if(aptItems.length)renderAptResults();
  if(detailFlash){setAiStatus(detailFlash,false);detailFlash=''}
}

function setAiStatus(msg,isErr){
  const el=$('#aiStatus');if(!el)return;
  el.hidden=!msg;
  el.className='status'+(isErr?' err':'');
  el.innerHTML=msg?msg:'';
}

/* ---------------- 아파트 단지 검색 ---------------- */
function aptQuery(){return{apt:$('#aptName').value.trim(),area:$('#aptArea').value.trim(),size:$('#aptSize').value.trim()}}

function renderAptResults(){
  const box=$('#aptResults');if(!box)return;
  if(!aptItems.length){box.textContent='일치하는 단지를 찾지 못했어요. 단지명 일부만 입력하거나 지역명을 확인해 주세요.';return}
  box.innerHTML='<b>검색 결과 '+aptItems.length+'개</b>'+aptItems.map((a,i)=>'<button type="button" class="btn alt" data-apt-index="'+i+'" style="display:block;width:100%;text-align:left;margin-top:7px;font-weight:600"><b>'+esc(a.kaptName||'이름 미상')+'</b><br><span class="small">'+esc([a.as1,a.as2,a.as3,a.doroJuso].filter(Boolean).join(' · '))+'</span></button>').join('');
  box.querySelectorAll('[data-apt-index]').forEach(b=>{b.onclick=()=>{
    const p=project(),a=aptItems[Number(b.dataset.aptIndex)];
    p.aptName=a.kaptName||$('#aptName').value.trim();
    p.aptCode=a.kaptCode||'';
    p.area=[a.as1,a.as2,a.as3].filter(Boolean).join(' ');
    save();
    $('#aptName').value=p.aptName;$('#aptArea').value=p.area;
    updateNaverLink();
    box.innerHTML='<b>단지를 선택했어요.</b><br>'+esc(p.aptName)+'<br><span class="small">'+esc(p.area)+' · 단지코드 '+esc(p.aptCode)+'</span><br><span class="small">이제 [🔍 도면 자동 불러오기]를 눌러 평면도 후보를 확인하세요.</span>';
  }});
}

function updateNaverLink(){
  const p=project();if(!p)return;
  const a=$('#naverPlan');if(!a)return;
  a.href='https://search.naver.com/search.naver?where=image&query='+encodeURIComponent([p.aptName||'',p.aptSize||'','평면도'].filter(Boolean).join(' '));
}

/* ---------------- 평면도 후보 ---------------- */
async function loadFloorplans(){
  const p=project();if(!p)return;
  const q=aptQuery();
  if(q.apt)p.aptName=q.apt;
  if(q.area)p.area=q.area;
  if(q.size)p.aptSize=q.size;
  save();updateNaverLink();
  if(!p.aptName){setAiStatus('먼저 아파트·단지명을 입력해 주세요.',true);return}
  const grid=$('#fpGrid');
  grid.innerHTML='';
  setAiStatus('<span class="spin"></span>평면도 후보 이미지를 찾고 있어요…');
  try{
    const u=new URL(API_BASE+'/floorplan-search');
    u.searchParams.set('apt',p.aptName);
    if(p.aptSize)u.searchParams.set('pyeong',p.aptSize);
    if(p.area)u.searchParams.set('area',p.area);
    const res=await fetch(u.toString(),{headers:{Accept:'application/json'}});
    const payload=await res.json().catch(()=>({}));
    if(!res.ok||payload.error)throw new Error(payload.detail||payload.error||('HTTP '+res.status));
    fpItems=Array.isArray(payload.items)?payload.items:[];
    if(!fpItems.length){setAiStatus('평면도 후보를 찾지 못했어요. 평형을 바꾸거나 [네이버에서 평면도 찾기]로 직접 골라 올려 주세요.',true);return}
    grid.innerHTML=fpItems.map((it,i)=>'<button type="button" class="fpcard" data-fp="'+i+'"><img loading="lazy" src="'+esc(it.thumbnail||it.image)+'" alt=""><span>'+esc((it.title||'평면도 후보').slice(0,50))+'</span></button>').join('');
    grid.querySelectorAll('img').forEach((img,k)=>{img.onerror=()=>{img.onerror=null;const it=fpItems[k];if(it&&it.image&&img.getAttribute('src')!==it.image)img.src=it.image}});
    grid.querySelectorAll('[data-fp]').forEach(b=>{b.onclick=()=>pickFloorplan(Number(b.dataset.fp))});
    setAiStatus('후보 '+fpItems.length+'장 · 마음에 드는 도면을 누르면 AI가 방과 치수를 읽어요.');
  }catch(err){
    setAiStatus('평면도 후보를 불러오지 못했어요. ('+esc(err.message)+') 아래 [네이버에서 평면도 찾기]로 직접 저장해 올릴 수 있어요.',true);
  }
}

function pickFloorplan(i){
  const it=fpItems[i];if(!it||!it.image)return;
  const p=project();
  const grid=$('#fpGrid');
  if(grid)grid.querySelectorAll('[data-fp]').forEach((b,k)=>b.style.outline=k===i?'2px solid var(--green)':'');
  analyzeFloorplan({imageUrl:it.image,aptName:p.aptName,sourceLabel:'평면도 후보'});
}

/* ---------------- AI 분석 ---------------- */
function resizeImage(dataUrl,maxSide,quality){
  return new Promise((resolve,reject)=>{
    const img=new Image();
    img.onload=()=>{
      const ratio=Math.min(1,maxSide/Math.max(img.width,img.height));
      const c=document.createElement('canvas');
      c.width=Math.max(1,Math.round(img.width*ratio));
      c.height=Math.max(1,Math.round(img.height*ratio));
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      try{resolve(c.toDataURL('image/jpeg',quality))}catch(e){reject(e)}
    };
    img.onerror=()=>reject(new Error('이미지를 읽을 수 없어요.'));
    img.src=dataUrl;
  });
}

async function analyzeFloorplan({dataUrl,imageUrl,aptName}){
  if(aiBusy)return;
  aiBusy=true;
  const p=project();
  const btns=['#loadFloorplan','#aiFromUpload'].map(s=>$(s)).filter(Boolean);
  btns.forEach(b=>b.disabled=true);
  setAiStatus('<span class="spin"></span>AI가 평면도에서 방과 치수를 읽고 있어요…');
  try{
    let body;
    if(imageUrl){
      body={imageUrl,aptName:aptName||''};
    }else{
      if(!dataUrl){setAiStatus('올린 평면도 이미지가 없어요.',true);return}
      const small=await resizeImage(dataUrl,1280,.85);
      body={imageBase64:small.split(',')[1],mimeType:'image/jpeg',aptName:aptName||''};
    }
    const res=await fetch(API_BASE+'/analyze-floorplan',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)});
    const payload=await res.json().catch(()=>({}));
    if(!res.ok||payload.error)throw new Error(payload.detail||payload.error||('HTTP '+res.status));
    const rooms=(payload.rooms||[]).filter(x=>x&&dim(Number(x.w))&&dim(Number(x.d)));
    if(!rooms.length)throw new Error('도면에서 방을 찾지 못했어요. 다른 이미지로 시도해 주세요.');
    let bg=null;
    if(payload.image&&payload.image.dataUrl){
      try{bg=await resizeImage(payload.image.dataUrl,1400,.8)}catch(e){bg=null}
    }
    applyAi({rooms,summary:payload.summary||'',hasExplicitDimensions:!!payload.hasExplicitDimensions,bg});
  }catch(err){
    setAiStatus('자동 인식에 실패했어요. '+(err.message||'')+' · 이미지를 직접 올려 다시 시도할 수 있어요.',true);
  }finally{
    aiBusy=false;
    btns.forEach(b=>b.disabled=false);
  }
}

function applyAi({rooms,summary,hasExplicitDimensions,bg}){
  const p=project();
  const hasFurniture=p.rooms.some(x=>x.items&&x.items.length);
  if(hasFurniture&&!confirm('배치해 둔 가구가 있어요. AI 결과로 공간을 새로 만들면 가구 배치가 사라져요. 계속할까요?'))return;
  p.rooms=rooms.map(x=>({id:uid(),name:String(x.name||'공간').slice(0,14),w:Math.round(Number(x.w)),d:Math.round(Number(x.d)),estimated:!!x.estimated,items:[]}));
  if(bg)p.planImage=bg;
  p.planMeta={summary:summary||'',hasExplicitDimensions:!!hasExplicitDimensions,at:new Date().toISOString()};
  rid=p.rooms[0].id;selected=null;
  const saved=save();
  detailFlash=(saved?'✅ ':'')+p.rooms.length+'개 공간을 채웠어요. '+(hasExplicitDimensions?'도면에 적힌 치수를 직접 읽었어요.':'치수 표기가 없어 표준 문 폭·가구 비율로 추정했어요. 필요하면 직접 고쳐 주세요.');
  render();
  renderDetail();
  $('#detail').scrollTop=0;
  if(!saved)save();
}

/* ---------------- 캔버스 ---------------- */
function draw(){
  const c=$('#floor'),r=room(),p=project();if(!c||!r)return;
  const box=$('.canvasbox');
  const maxW=Math.max(120,Math.min(600,box.clientWidth-24)),maxH=380;
  scale=Math.min(maxW/r.w,maxH/r.d);
  let w=Math.max(1,Math.round(r.w*scale)),h=Math.max(1,Math.round(r.d*scale)),dpr=devicePixelRatio||1;
  c.width=w*dpr;c.height=h*dpr;c.style.width=w+'px';c.style.height=h+'px';
  let x=c.getContext('2d');x.scale(dpr,dpr);
  x.fillStyle='#fff';x.fillRect(0,0,w,h);
  const bg=r.planImage||p?.planImage||null;
  if(bg){
    let im=planCache.get(bg);
    if(!im){im=new Image();im.src=bg;planCache.set(bg,im);im.onload=()=>{if($('#detail').open&&room()?.id===r.id)draw()}}
    if(im.complete&&im.naturalWidth){
      const s=Math.min(w/im.naturalWidth,h/im.naturalHeight);
      const dw=im.naturalWidth*s,dh=im.naturalHeight*s;
      x.save();x.globalAlpha=r.planImage?.55:.4;x.drawImage(im,(w-dw)/2,(h-dh)/2,dw,dh);x.restore();
    }
  }
  x.strokeStyle='#edf0e9';
  for(let a=0;a<w;a+=20){x.beginPath();x.moveTo(a,0);x.lineTo(a,h);x.stroke()}
  for(let a=0;a<h;a+=20){x.beginPath();x.moveTo(0,a);x.lineTo(w,a);x.stroke()}
  x.strokeStyle='#667568';x.lineWidth=4;x.strokeRect(2,2,w-4,h-4);
  r.items.forEach(i=>{
    let iw=(i.rot?i.d:i.w)*scale,ih=(i.rot?i.w:i.d)*scale;
    x.fillStyle=i.id===selected?'#cbd9c7':'#e5eadd';x.strokeStyle='#667d68';
    x.fillRect(i.x*scale,i.y*scale,iw,ih);x.strokeRect(i.x*scale,i.y*scale,iw,ih);
    x.fillStyle='#334';x.font='11px sans-serif';x.fillText(i.name.slice(0,10),i.x*scale+3,i.y*scale+14);
  });
  syncSelection();
}
function syncSelection(){const ok=!!selected;const a=$('#rotate'),b=$('#remove');if(a)a.disabled=!ok;if(b)b.disabled=!ok}
function down(e){
  let c=e.currentTarget,b=c.getBoundingClientRect(),x=(e.clientX-b.left)/scale,y=(e.clientY-b.top)/scale,r0=room();
  let hit=[...r0.items].reverse().find(i=>x>=i.x&&x<=i.x+(i.rot?i.d:i.w)&&y>=i.y&&y<=i.y+(i.rot?i.w:i.d));
  selected=hit?.id||null;
  if(hit){drag={id:hit.id,dx:x-hit.x,dy:y-hit.y};c.setPointerCapture(e.pointerId)}
  draw();
}
function move(e){
  if(!drag)return;
  let b=e.currentTarget.getBoundingClientRect(),x=(e.clientX-b.left)/scale,y=(e.clientY-b.top)/scale;
  let i=room().items.find(z=>z.id===drag.id);if(!i)return;
  i.x=Math.max(0,Math.min(room().w-(i.rot?i.d:i.w),x-drag.dx));
  i.y=Math.max(0,Math.min(room().d-(i.rot?i.w:i.d),y-drag.dy));
  draw();
}
function up(){if(drag){drag=null;save();report(false)}}
function analyze(r){
  return r.items.map((a,i)=>{
    let aw=a.rot?a.d:a.w,ah=a.rot?a.w:a.d,why='가능';
    if(a.x+aw>r.w||a.y+ah>r.d)why='공간 초과';
    else if(r.items.slice(0,i).some(b=>{let bw=b.rot?b.d:b.w,bh=b.rot?b.w:b.d;return a.x<b.x+bw&&a.x+aw>b.x&&a.y<b.y+bh&&a.y+ah>b.y}))why='가구 겹침';
    return{name:a.name,result:why};
  });
}
function report(show){
  const r=room();if(!r)return;
  let a=analyze(r),bad=a.filter(x=>x.result!=='가능').length;
  $('#report').innerHTML='배치 가구 '+a.length+'개 · 배치 가능 '+(a.length-bad)+'개 · 확인 필요 '+bad+'개'+(show?'<hr>'+a.map(x=>esc(x.name)+' : '+x.result).join('<br>'):'');
}

/* ---------------- 바인딩 ---------------- */
function bind(){
  const p=project(),r=room();
  $('#closeDetail').onclick=()=>$('#detail').close();
  $('#searchPlan').onclick=async()=>{
    const q=aptQuery();
    if(!q.apt)return alert('아파트 또는 단지명을 입력해 주세요.');
    if(q.apt.length<2)return alert('단지명을 두 글자 이상 입력해 주세요.');
    p.aptName=q.apt;p.area=q.area;p.aptSize=q.size;save();updateNaverLink();
    const box=$('#aptResults');
    box.textContent='전국 단지 데이터에서 검색 중이에요…';
    try{
      const u=new URL(API_BASE+'/');
      u.searchParams.set('q',q.apt);
      if(q.area)u.searchParams.set('region',q.area);
      const res=await fetch(u.toString(),{headers:{Accept:'application/json'}});
      const payload=await res.json().catch(()=>({}));
      if(!res.ok){const detail=payload.detail||payload.error||('HTTP '+res.status);throw new Error(detail)}
      aptItems=Array.isArray(payload.items)?payload.items:[];
      renderAptResults();
    }catch(err){
      box.textContent='자동 검색에 연결하지 못했어요. ('+err.message+')';
    }
  };
  $('#loadFloorplan').onclick=loadFloorplans;
  $('#aptSize').onchange=()=>{p.aptSize=$('#aptSize').value.trim();save();updateNaverLink()};

  $('#addRoom').onclick=()=>{
    const n=prompt('공간 이름','침실');if(!n)return;
    const w=Number(prompt('가로(mm)','3000')),d=Number(prompt('세로(mm)','3000'));
    if(!dim(w)||!dim(d))return alert('500~30,000mm로 입력해 주세요.');
    const x={id:uid(),name:n,w,d,items:[]};p.rooms.push(x);rid=x.id;save();renderDetail();
  };
  $('#applySize').onclick=()=>{
    let w=Number($('#rw').value),d=Number($('#rd').value),n=$('#rname').value.trim();
    if(!dim(w)||!dim(d))return alert('500~30,000mm로 입력해 주세요.');
    r.w=w;r.d=d;if(n)r.name=n.slice(0,14);
    save();renderDetail();
  };
  $('#planUpload').onchange=e=>{
    const file=e.target.files?.[0];if(!file)return;
    if(!['image/jpeg','image/png','image/webp'].includes(file.type))return alert('JPG, PNG, WebP 이미지 파일만 올릴 수 있어요.');
    if(file.size>8*1024*1024)return alert('원본 이미지가 8MB를 초과해요. 더 작은 이미지로 올려 주세요.');
    const reader=new FileReader();
    reader.onload=()=>{
      resizeImage(reader.result,1400,.78).then(dataUrl=>{
        r.planImage=dataUrl;
        if(!save()){r.planImage=null;return}
        $('#planStatus').textContent='도면 등록 완료 · AI로 방·치수를 읽을 수 있어요.';
        $('#removePlan').disabled=false;
        const ai=$('#aiFromUpload');if(ai)ai.disabled=false;
        draw();
      }).catch(()=>alert('이미지를 읽을 수 없어요. 다른 파일로 시도해 주세요.'));
    };
    reader.readAsDataURL(file);
  };
  $('#aiFromUpload').onclick=()=>{
    if(!r.planImage)return alert('먼저 평면도 이미지를 올려 주세요.');
    analyzeFloorplan({dataUrl:r.planImage,aptName:p.aptName});
  };
  $('#removePlan').onclick=()=>{
    r.planImage=null;save();
    $('#planStatus').textContent='등록된 도면이 없어요.';$('#removePlan').disabled=true;
    const ai=$('#aiFromUpload');if(ai)ai.disabled=true;
    draw();
  };
  $('#place').onclick=()=>{
    const f=data.furniture.find(x=>x.id===$('#fselect').value);if(!f)return;
    const x={id:uid(),name:f.name,w:f.w,d:f.d,x:Math.max(0,Math.min(r.w-f.w,(r.w-f.w)/2)),y:Math.max(0,Math.min(r.d-f.d,(r.d-f.d)/2)),rot:0};
    r.items.push(x);selected=x.id;save();renderDetail();
  };
  $('#rotate').onclick=()=>{const x=r.items.find(i=>i.id===selected);if(x){x.rot=(x.rot+90)%180;save();draw();report(false)}};
  $('#remove').onclick=()=>{r.items=r.items.filter(x=>x.id!==selected);selected=null;save();renderDetail()};
  $('#check').onclick=()=>report(true);
  $('#saveProject').onclick=()=>{if(save())alert('저장했어요.')};
  $('#deleteProject').onclick=()=>{if(confirm('프로젝트를 삭제할까요?')){data.projects=data.projects.filter(x=>x.id!==pid);save();$('#detail').close();render()}};
  $('#print').onclick=()=>{
    const r0=room(),w=window.open('','_blank');if(!w)return;
    w.document.write('<h1>이사핏 공간 리포트</h1><p>'+esc(p.name)+' · '+esc(r0.name)+' · '+r0.w+'×'+r0.d+'mm</p><pre>'+esc(JSON.stringify(analyze(r0),null,2))+'</pre>');
    w.print();
  };
  const c=$('#floor');
  c.addEventListener('pointerdown',down);c.addEventListener('pointermove',move);c.addEventListener('pointerup',up);c.addEventListener('pointercancel',up);
}

/* ---------------- 전역 ---------------- */
$('#projects').onclick=e=>{let b=e.target.closest('[data-project]');if(b)openProject(b.dataset.project)};
$('#furniture').onclick=e=>{let b=e.target.closest('[data-del]');if(b){data.furniture=data.furniture.filter(x=>x.id!==b.dataset.del);save();render()}};
document.addEventListener('click',e=>{
  let b=e.target.closest('[data-room]');
  if(b&&$('#detail').open){rid=b.dataset.room;selected=null;renderDetail()}
  let c=e.target.closest('[data-close]');
  if(c)$('#'+c.dataset.close).close();
});
$('#newProject').onclick=()=>$('#projectDialog').showModal();
$('#newFurniture').onclick=()=>$('#furnitureDialog').showModal();
$('#projectForm').onsubmit=e=>{
  e.preventDefault();
  let f=new FormData(e.target);
  let p={id:uid(),name:f.get('name'),area:f.get('area'),aptName:f.get('aptName'),aptSize:f.get('aptSize'),date:f.get('date'),memo:f.get('memo'),rooms:[{id:uid(),name:'거실',w:4000,d:3500,items:[]}]};
  data.projects.unshift(p);save();render();e.target.reset();$('#projectDialog').close();openProject(p.id);
};
$('#furnitureForm').onsubmit=e=>{
  e.preventDefault();
  let f=new FormData(e.target);
  let x={id:uid(),type:f.get('type'),name:f.get('name'),w:Number(f.get('w')),d:Number(f.get('d')),h:Number(f.get('h'))||0,memo:f.get('memo')};
  if(!dim(x.w)||!dim(x.d))return alert('가로와 세로는 500~30,000mm로 입력해 주세요.');
  data.furniture.push(x);save();render();e.target.reset();$('#furnitureDialog').close();
};
$('#export').onclick=()=>{
  let a=document.createElement('a'),u=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));
  a.href=u;a.download='isafit-backup.json';a.click();URL.revokeObjectURL(u);
};
$('#import').onchange=e=>{
  let f=e.target.files[0];if(!f)return;
  let r=new FileReader();
  r.onload=()=>{
    try{
      let v=JSON.parse(r.result);
      if(!v||!Array.isArray(v.projects)||!Array.isArray(v.furniture)||!v.projects.every(p=>p&&typeof p.name==='string'&&Array.isArray(p.rooms)&&p.rooms.every(r=>r&&Number.isFinite(r.w)&&Number.isFinite(r.d)&&Array.isArray(r.items)))||!v.furniture.every(f=>f&&typeof f.name==='string'&&Number.isFinite(f.w)&&Number.isFinite(f.d)))throw 0;
      data=v;save();render();alert('백업을 불러왔어요.');
    }catch{alert('올바른 백업 파일이 아니에요.')}
  };
  r.readAsText(f);
};
window.addEventListener('resize',()=>{if($('#detail').open)draw()});
render();
})();
</script></body></html>
