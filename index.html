<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f7f6f2"><meta name="description" content="내 가구가 새집에 들어갈지 이사 전에 확인하는 이사핏"><title>이사핏 | 내 생활에 맞는 집 찾기</title><style>
:root{--ink:#282b28;--muted:#858981;--paper:#f7f6f2;--line:#e9e8e1;--green:#536c58;--sage:#e8eee6}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.55 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif}.top{position:sticky;top:0;background:#ffffffed;border-bottom:1px solid var(--line);padding:15px 5vw;display:flex;justify-content:space-between;align-items:center;z-index:2}.brand{font-weight:850;font-size:20px}.mark{display:inline-grid;place-items:center;background:var(--green);color:white;border-radius:9px;width:29px;height:29px;margin-right:8px}.wrap{max-width:1100px;margin:auto;padding:24px}.hero{background:#eaece4;border-radius:24px;padding:38px;margin:12px 0 42px;display:flex;justify-content:space-between;gap:20px;align-items:center}.hero h1{font-size:clamp(28px,4vw,43px);line-height:1.2;margin:10px 0}.hero em{color:var(--green);font-style:normal}.hero p,.muted{color:var(--muted)}.eyebrow{font-size:10px;letter-spacing:2px;color:#87917f;font-weight:800}.btn{border:0;border-radius:10px;padding:11px 15px;background:var(--green);color:white;font-weight:700;cursor:pointer}.btn.alt{background:white;color:var(--green);border:1px solid #dfe3da}.btn:disabled{opacity:.4;cursor:not-allowed}.head{display:flex;justify-content:space-between;align-items:end;margin:30px 0 15px}.head h2{margin:4px 0;font-size:23px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:13px}.card{background:white;border:1px solid var(--line);border-radius:16px;padding:17px}.project{cursor:pointer;text-align:left;color:inherit;width:100%}.project h3{margin:10px 0 3px}.empty{padding:25px;text-align:center;color:var(--muted);border:1px dashed #cfd7ca;border-radius:14px}.furniture{font-size:13px}.actions{display:flex;gap:8px;flex-wrap:wrap}.dialog{border:0;border-radius:18px;width:min(680px,calc(100% - 24px));padding:22px;box-shadow:0 20px 70px #0003}.dialog::backdrop{background:#18201888}.dialog{max-height:90dvh;overflow:auto}.dialog h2{margin:4px 0 18px}.fields{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.fields label{display:block;font-size:12px;color:#596357;font-weight:700}.fields input,.fields select,.fields textarea{display:block;width:100%;padding:10px;border:1px solid var(--line);border-radius:9px;margin-top:5px;background:#fff}.wide{grid-column:1/-1}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.room-layout{display:grid;grid-template-columns:260px 1fr;gap:16px}.panel{background:#fbfaf7;border:1px solid var(--line);border-radius:13px;padding:13px;margin-bottom:10px}.panel h3{font-size:14px;margin:0 0 10px}.panel input,.panel select{width:100%;padding:9px;border:1px solid var(--line);border-radius:8px;margin:4px 0 8px}.canvasbox{background:#efeee8;border-radius:13px;padding:12px;overflow:auto;display:grid;place-items:center;min-height:300px}canvas{background:white;touch-action:none;max-width:100%}.small{font-size:11px;color:var(--muted)}.roomlist button{width:100%;text-align:left;margin:3px 0;background:white;color:var(--ink);border:1px solid var(--line)}.roomlist button.active{background:var(--sage);border-color:#8ca18a}.status{padding:10px;background:white;border-radius:9px;margin-top:10px;font-size:12px}.danger{background:transparent;color:#a15f50;border:0;cursor:pointer}.footer{border-top:1px solid var(--line);padding:22px;text-align:center;color:var(--muted);font-size:11px}@media(max-width:700px){.wrap{padding:15px}.hero{padding:25px}.room-layout{grid-template-columns:1fr}.fields{grid-template-columns:1fr}.wide{grid-column:auto}.head h2{font-size:20px}.top{padding:12px 16px}}
</style></head><body>
<header class="top"><div class="brand"><span class="mark">이</span>이사핏</div><div class="actions"><button class="btn alt" id="export">백업</button><label class="btn alt">불러오기<input id="import" type="file" accept="application/json" hidden></label></div></header>
<main class="wrap"><section class="hero"><div><span class="eyebrow">MOVE WITH A PLAN</span><h1>집을 고르기 전에,<br><em>내 생활을 먼저 배치해요.</em></h1><p>후보 공간을 등록하고 내 가구를 배치해<br>이사 전에 크기와 겹침을 확인해 보세요.</p><button class="btn" id="newProject">＋ 새 이사 프로젝트</button></div><div style="font-size:100px;color:#81927e">⌂</div></section>
<section><div class="head"><div><span class="eyebrow">MY MOVE</span><h2>나의 이사 프로젝트</h2></div><span class="muted" id="count">0개</span></div><div id="projects" class="grid"></div><div id="emptyP" class="empty">아직 등록한 프로젝트가 없어요. 첫 이사 프로젝트를 만들어 보세요.</div></section>
<section><div class="head"><div><span class="eyebrow">MY FURNITURE</span><h2>내 가구 보관함</h2></div><button class="btn alt" id="newFurniture">＋ 가구 등록</button></div><div id="furniture" class="grid"></div><div id="emptyF" class="empty">침대, 소파, 책상 등 가구를 등록해 보세요.</div></section></main>
<dialog class="dialog" id="projectDialog"><form id="projectForm"><h2>새 이사 프로젝트</h2><div class="fields"><label>프로젝트 이름<input name="name" required placeholder="예: 새집 후보 A"></label><label>지역<input name="area" placeholder="예: 김해시"></label><label>희망 이사일<input name="date" type="date"></label><label>메모<input name="memo" placeholder="원하는 조건"></label></div><div class="modal-actions"><button type="button" class="btn alt" data-close="projectDialog">취소</button><button class="btn">만들기</button></div></form></dialog>
<dialog class="dialog" id="furnitureDialog"><form id="furnitureForm"><h2>내 가구 등록</h2><div class="fields"><label>종류<select name="type"><option>침대</option><option>소파</option><option>냉장고</option><option>책상</option><option>식탁</option><option>옷장</option><option>기타</option></select></label><label>가구 이름<input name="name" required placeholder="예: 퀸 침대"></label><label>가로(mm)<input name="w" type="number" min="500" required></label><label>세로(mm)<input name="d" type="number" min="500" required></label><label>높이(mm)<input name="h" type="number" min="0"></label><label>메모<input name="memo"></label></div><div class="modal-actions"><button type="button" class="btn alt" data-close="furnitureDialog">취소</button><button class="btn">저장</button></div></form></dialog>
<dialog class="dialog" id="detail" style="width:min(1000px,calc(100% - 20px))"><div id="detailContent"></div></dialog>
<footer class="footer">이사핏 초기 체험 버전 · 데이터는 현재 브라우저에 저장됩니다. 실제 치수와 현장 조건은 별도로 확인해 주세요.</footer>
<script>
(()=>{const $=s=>document.querySelector(s),key='isafit-v1';let data=load(),pid=null,rid=null,selected=null,drag=null,scale=.15;function load(){try{return JSON.parse(localStorage.getItem(key))||{projects:[],furniture:[]}}catch{return{projects:[],furniture:[]}}}function save(){localStorage.setItem(key,JSON.stringify(data))}function id(){return Math.random().toString(36).slice(2,10)}function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function project(){return data.projects.find(x=>x.id===pid)}function room(){return project()?.rooms.find(x=>x.id===rid)}function dim(v){return Number.isFinite(v)&&v>=500&&v<=30000}function render(){ $('#count').textContent=data.projects.length+'개';$('#emptyP').hidden=!!data.projects.length;$('#projects').innerHTML=data.projects.map(p=>'<button class="card project" data-project="'+p.id+'"><span class="eyebrow">MOVE PROJECT</span><h3>'+esc(p.name)+'</h3><span class="muted">'+esc(p.area||'지역 미입력')+' · '+p.rooms.length+'개 공간</span></button>').join('');$('#emptyF').hidden=!!data.furniture.length;$('#furniture').innerHTML=data.furniture.map(f=>'<div class="card furniture"><b>'+esc(f.name)+'</b><p>'+esc(f.type)+' · '+f.w+' × '+f.d+'mm</p><button class="danger" data-del="'+f.id+'">삭제</button></div>').join('')}function openProject(id0){pid=id0;const p=project();rid=p.rooms[0].id;$('#detail').showModal();renderDetail()}function renderDetail(){const p=project(),r=room();$('#detailContent').innerHTML='<div class="head"><div><span class="eyebrow">YOUR SPACE</span><h2>'+esc(p.name)+'</h2><span class="muted">'+esc(p.area||'지역 미입력')+'</span></div><button class="btn alt" id="closeDetail">닫기</button></div><div class="room-layout"><aside><div class="panel"><h3>공간 목록</h3><div class="roomlist">'+p.rooms.map(x=>'<button class="btn alt '+(x.id===rid?'active':'')+'" data-room="'+x.id+'">'+esc(x.name)+' · '+x.w+'×'+x.d+'</button>').join('')+'</div><button class="btn alt" id="addRoom">＋ 공간 추가</button></div><div class="panel"><h3>공간 크기(mm)</h3><label class="small">가로</label><input id="rw" type="number" value="'+r.w+'"><label class="small">세로</label><input id="rd" type="number" value="'+r.d+'"><button class="btn alt" id="applySize">크기 적용</button></div><div class="panel"><h3>가구 배치</h3><select id="fselect"><option value="">가구 선택</option>'+data.furniture.map(f=>'<option value="'+f.id+'">'+esc(f.name)+' · '+f.w+'×'+f.d+'</option>').join('')+'</select><button class="btn" id="place" '+(!data.furniture.length?'disabled':'')+'>선택한 가구 배치</button><p class="small">가구를 클릭한 뒤 드래그해 이동하고 회전할 수 있어요.</p><button class="btn alt" id="rotate" '+(!selected?'disabled':'')+'>↻ 90° 회전</button><button class="btn alt" id="remove" '+(!selected?'disabled':'')+'>선택 삭제</button></div></aside><section><div class="canvasbox"><canvas id="floor"></canvas></div><div id="report" class="status"></div><div class="actions" style="margin-top:10px"><button class="btn alt" id="check">공간 검사</button><button class="btn alt" id="print">리포트 인쇄</button></div><p class="small">검사는 가구 외곽 사각형의 겹침과 방 경계만 확인합니다. 문·창문·벽 두께·운반 경로는 판정하지 않아요.</p></section></div><div style="display:flex;justify-content:space-between;margin-top:15px"><button class="danger" id="deleteProject">프로젝트 삭제</button><button class="btn" id="saveProject">저장</button></div>';bind();draw();report(false)}function bind(){const p=project();$('#closeDetail').onclick=()=>$('#detail').close();$('#addRoom').onclick=()=>{const n=prompt('공간 이름','침실');if(!n)return;const w=Number(prompt('가로(mm)','3000')),d=Number(prompt('세로(mm)','3000'));if(!dim(w)||!dim(d))return alert('500~30,000mm로 입력해 주세요.');const x={id:id(),name:n,w,d,items:[]};p.rooms.push(x);rid=x.id;save();renderDetail()};$('#applySize').onclick=()=>{let w=Number($('#rw').value),d=Number($('#rd').value);if(!dim(w)||!dim(d))return alert('500~30,000mm로 입력해 주세요.');room().w=w;room().d=d;save();draw();report(false)};$('#place').onclick=()=>{const f=data.furniture.find(x=>x.id===$('#fselect').value);if(!f)return;const x={id:id(),name:f.name,w:f.w,d:f.d,x:Math.max(0,Math.min(room().w-f.w,(room().w-f.w)/2)),y:Math.max(0,Math.min(room().d-f.d,(room().d-f.d)/2)),rot:0};room().items.push(x);selected=x.id;save();renderDetail()};$('#rotate').onclick=()=>{const x=room().items.find(i=>i.id===selected);if(x){x.rot=(x.rot+90)%180;save();draw();report(false)}};$('#remove').onclick=()=>{room().items=room().items.filter(x=>x.id!==selected);selected=null;save();renderDetail()};$('#check').onclick=()=>report(true);$('#saveProject').onclick=()=>{save();alert('저장했어요.')};$('#deleteProject').onclick=()=>{if(confirm('프로젝트를 삭제할까요?')){data.projects=data.projects.filter(x=>x.id!==pid);save();$('#detail').close();render()}};$('#print').onclick=()=>{const r0=room(),w=window.open('','_blank');if(!w)return;w.document.write('<h1>이사핏 공간 리포트</h1><p>'+esc(p.name)+' · '+esc(r0.name)+' · '+r0.w+'×'+r0.d+'mm</p><pre>'+esc(JSON.stringify(analyze(r0),null,2))+'</pre>');w.print()};$('#floor').addEventListener('pointerdown',down);$('#floor').addEventListener('pointermove',move);$('#floor').addEventListener('pointerup',up);$('#floor').addEventListener('pointercancel',up)}function draw(){const c=$('#floor'),r=room(),box=$('.canvasbox'),maxW=Math.max(120,Math.min(600,box.clientWidth-24)),maxH=380;scale=Math.min(maxW/r.w,maxH/r.d);let w=Math.max(1,Math.round(r.w*scale)),h=Math.max(1,Math.round(r.d*scale)),dpr=devicePixelRatio||1;c.width=w*dpr;c.height=h*dpr;c.style.width=w+'px';c.style.height=h+'px';let x=c.getContext('2d');x.scale(dpr,dpr);x.fillStyle='#fff';x.fillRect(0,0,w,h);x.strokeStyle='#edf0e9';for(let a=0;a<w;a+=20){x.beginPath();x.moveTo(a,0);x.lineTo(a,h);x.stroke()}for(let a=0;a<h;a+=20){x.beginPath();x.moveTo(0,a);x.lineTo(w,a);x.stroke()}x.strokeStyle='#667568';x.lineWidth=4;x.strokeRect(2,2,w-4,h-4);r.items.forEach(i=>{let iw=(i.rot?i.d:i.w)*scale,ih=(i.rot?i.w:i.d)*scale;x.fillStyle=i.id===selected?'#cbd9c7':'#e5eadd';x.strokeStyle='#667d68';x.fillRect(i.x*scale,i.y*scale,iw,ih);x.strokeRect(i.x*scale,i.y*scale,iw,ih);x.fillStyle='#334';x.font='11px sans-serif';x.fillText(i.name.slice(0,10),i.x*scale+3,i.y*scale+14)});syncSelection()}function syncSelection(){const ok=!!selected;$('#rotate').disabled=!ok;$('#remove').disabled=!ok}function down(e){let c=e.currentTarget,b=c.getBoundingClientRect(),x=(e.clientX-b.left)/scale,y=(e.clientY-b.top)/scale,r0=room();let hit=[...r0.items].reverse().find(i=>x>=i.x&&x<=i.x+(i.rot?i.d:i.w)&&y>=i.y&&y<=i.y+(i.rot?i.w:i.d));selected=hit?.id||null;if(hit){drag={id:hit.id,dx:x-hit.x,dy:y-hit.y};c.setPointerCapture(e.pointerId)}draw()}function move(e){if(!drag)return;let b=e.currentTarget.getBoundingClientRect(),x=(e.clientX-b.left)/scale,y=(e.clientY-b.top)/scale,i=room().items.find(z=>z.id===drag.id);i.x=Math.max(0,Math.min(room().w-(i.rot?i.d:i.w),x-drag.dx));i.y=Math.max(0,Math.min(room().d-(i.rot?i.w:i.d),y-drag.dy));draw()}function up(){if(drag){drag=null;save();report(false)}}function analyze(r){return r.items.map((a,i)=>{let aw=a.rot?a.d:a.w,ah=a.rot?a.w:a.d,why='가능';if(a.x+aw>r.w||a.y+ah>r.d)why='공간 초과';else if(r.items.slice(0,i).some(b=>{let bw=b.rot?b.d:b.w,bh=b.rot?b.w:b.d;return a.x<b.x+bw&&a.x+aw>b.x&&a.y<b.y+bh&&a.y+ah>b.y}))why='가구 겹침';return{name:a.name,result:why}})}function report(show){let a=analyze(room()),bad=a.filter(x=>x.result!=='가능').length;$('#report').innerHTML='배치 가구 '+a.length+'개 · 배치 가능 '+(a.length-bad)+'개 · 확인 필요 '+bad+'개'+(show?'<hr>'+a.map(x=>esc(x.name)+' : '+x.result).join('<br>'):'')}$('#projects').onclick=e=>{let b=e.target.closest('[data-project]');if(b)openProject(b.dataset.project)};$('#furniture').onclick=e=>{let b=e.target.closest('[data-del]');if(b){data.furniture=data.furniture.filter(x=>x.id!==b.dataset.del);save();render()}};document.addEventListener('click',e=>{let b=e.target.closest('[data-room]');if(b&&$('#detail').open){rid=b.dataset.room;selected=null;renderDetail()}let c=e.target.closest('[data-close]');if(c)$('#'+c.dataset.close).close()});$('#newProject').onclick=()=>$('#projectDialog').showModal();$('#newFurniture').onclick=()=>$('#furnitureDialog').showModal();$('#projectForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),p={id:id(),name:f.get('name'),area:f.get('area'),date:f.get('date'),memo:f.get('memo'),rooms:[{id:id(),name:'거실',w:4000,d:3500,items:[]}]};data.projects.unshift(p);save();render();e.target.reset();$('#projectDialog').close();openProject(p.id)};$('#furnitureForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),x={id:id(),type:f.get('type'),name:f.get('name'),w:Number(f.get('w')),d:Number(f.get('d')),h:Number(f.get('h'))||0,memo:f.get('memo')};if(!dim(x.w)||!dim(x.d))return alert('가로와 세로는 500~30,000mm로 입력해 주세요.');data.furniture.push(x);save();render();e.target.reset();$('#furnitureDialog').close()};$('#export').onclick=()=>{let a=document.createElement('a'),u=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.href=u;a.download='isafit-backup.json';a.click();URL.revokeObjectURL(u)};$('#import').onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let v=JSON.parse(r.result);if(!v||!Array.isArray(v.projects)||!Array.isArray(v.furniture)||!v.projects.every(p=>p&&typeof p.name==='string'&&Array.isArray(p.rooms)&&p.rooms.every(r=>r&&Number.isFinite(r.w)&&Number.isFinite(r.d)&&Array.isArray(r.items)))||!v.furniture.every(f=>f&&typeof f.name==='string'&&Number.isFinite(f.w)&&Number.isFinite(f.d)))throw 0;data=v;save();render();alert('백업을 불러왔어요.')}catch{alert('올바른 백업 파일이 아니에요.')}};r.readAsText(f)};window.addEventListener('resize',()=>{if($('#detail').open)draw()});render()})();
</script></body></html>
